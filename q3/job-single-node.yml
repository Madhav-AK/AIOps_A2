apiVersion: batch/v1
kind: Job
metadata:
  name: email-validator-job
  labels:
    app: email-validator
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: email-validator
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: email-validator-worker:v2
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_DIR
          value: "/app/data"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1000m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"